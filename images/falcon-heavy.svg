<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sky Twilight Gradient -->
    <linearGradient id="fhSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020308"/>
      <stop offset="45%" stop-color="#070a1a"/>
      <stop offset="75%" stop-color="#111633"/>
      <stop offset="100%" stop-color="#1f183c"/>
    </linearGradient>

    <!-- Pad Floodlight Glow -->
    <radialGradient id="padGlow" cx="50%" cy="75%" r="50%">
      <stop offset="0%" stop-color="rgba(160, 200, 255, 0.4)"/>
      <stop offset="40%" stop-color="rgba(100, 140, 220, 0.18)"/>
      <stop offset="80%" stop-color="rgba(20, 30, 60, 0.05)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <!-- Booster Shading -->
    <linearGradient id="fhBooster" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8ecf2"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#9aa5b8"/>
      <stop offset="100%" stop-color="#464e5e"/>
    </linearGradient>

    <linearGradient id="fhDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16181d"/>
      <stop offset="50%" stop-color="#303542"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#fhSky)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="150" cy="120" r="1.5"/>
    <circle cx="320" cy="60" r="1"/>
    <circle cx="580" cy="140" r="1.8"/>
    <circle cx="890" cy="70" r="1.2"/>
    <circle cx="1140" cy="110" r="1.5"/>
    <circle cx="1400" cy="50" r="1"/>
    <circle cx="1650" cy="130" r="2"/>
    <circle cx="1820" cy="90" r="1.2"/>
    <circle cx="240" cy="280" r="1.2"/>
    <circle cx="1600" cy="260" r="1.5"/>
  </g>

  <!-- Launch Pad Floodlights Glow -->
  <ellipse cx="960" cy="700" rx="700" ry="400" fill="url(#padGlow)"/>

  <!-- Distant Florida Flat Horizon -->
  <rect x="0" y="860" width="1920" height="220" fill="#04060b"/>
  <line x1="0" y1="860" x2="1920" y2="860" stroke="#131c33" stroke-width="2"/>

  <!-- Launch Mount / Strongback Tower Structure -->
  <g stroke="#1a243a" stroke-width="2" fill="#0a0f1d">
    <rect x="1100" y="320" width="45" height="540"/>
    <line x1="1100" y1="360" x2="1145" y2="400"/>
    <line x1="1100" y1="440" x2="1145" y2="480"/>
    <line x1="1100" y1="520" x2="1145" y2="560"/>
    <line x1="1100" y1="600" x2="1145" y2="640"/>
    <line x1="1100" y1="680" x2="1145" y2="720"/>
    <line x1="1100" y1="760" x2="1145" y2="800"/>
  </g>

  <!-- Falcon Heavy Standing on Transporter Erector at Center -->
  <g transform="translate(960, 560)">
    <!-- Launch Pad Pedestal -->
    <rect x="-90" y="270" width="180" height="40" fill="#151922" stroke="#252d3d"/>

    <!-- Left Side Booster -->
    <g transform="translate(-46, 0)">
      <rect x="-14" y="-30" width="28" height="300" fill="url(#fhBooster)"/>
      <!-- Nose Cone -->
      <path d="M-14,-30 C-14,-75 -5,-110 0,-130 C5,-110 14,-75 14,-30 Z" fill="url(#fhBooster)"/>
      <!-- Grid Fins -->
      <rect x="-24" y="-20" width="10" height="6" fill="#2d3139"/>
      <rect x="14" y="-20" width="10" height="6" fill="#2d3139"/>
      <!-- Engine Nozzles Base -->
      <rect x="-13" y="270" width="26" height="12" fill="#13161c"/>
    </g>

    <!-- Right Side Booster -->
    <g transform="translate(46, 0)">
      <rect x="-14" y="-30" width="28" height="300" fill="url(#fhBooster)"/>
      <!-- Nose Cone -->
      <path d="M-14,-30 C-14,-75 -5,-110 0,-130 C5,-110 14,-75 14,-30 Z" fill="url(#fhBooster)"/>
      <!-- Grid Fins -->
      <rect x="-24" y="-20" width="10" height="6" fill="#2d3139"/>
      <rect x="14" y="-20" width="10" height="6" fill="#2d3139"/>
      <!-- Engine Nozzles Base -->
      <rect x="-13" y="270" width="26" height="12" fill="#13161c"/>
    </g>

    <!-- Center Core & Upper Stage (Taller than side boosters) -->
    <g transform="translate(0, 0)">
      <!-- First Stage Core -->
      <rect x="-15" y="-30" width="30" height="300" fill="url(#fhBooster)"/>
      <!-- Grid Fins -->
      <rect x="-26" y="-22" width="11" height="6" fill="#2d3139"/>
      <rect x="15" y="-22" width="11" height="6" fill="#2d3139"/>
      <!-- Interstage -->
      <rect x="-15" y="-90" width="30" height="60" fill="url(#fhDark)"/>
      <!-- Second Stage -->
      <rect x="-15" y="-180" width="30" height="90" fill="url(#fhBooster)"/>
      <!-- Payload Fairing -->
      <path d="M-19,-180 C-19,-250 -10,-310 0,-340 C10,-310 19,-250 19,-180 Z" fill="url(#fhBooster)"/>
      <!-- Engine Base -->
      <rect x="-14" y="270" width="28" height="12" fill="#13161c"/>
    </g>

    <!-- Pad Lighting Spotlights Beams -->
    <polygon points="-300,300 -60,100 -40,110 -280,300" fill="rgba(200, 230, 255, 0.08)"/>
    <polygon points="300,300 60,100 40,110 280,300" fill="rgba(200, 230, 255, 0.08)"/>
  </g>

  <!-- Launch Pad Base Steam Glow -->
  <ellipse cx="960" cy="850" rx="400" ry="60" fill="rgba(255, 255, 255, 0.05)"/>
</svg>