<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Space Gradient -->
    <radialGradient id="deepCosmos" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#030408"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Planetary Sunrise Glow -->
    <radialGradient id="sunDawn" cx="65%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fde047"/>
      <stop offset="30%" stop-color="#fb923c"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="rgba(14, 165, 233, 0.3)"/>
      <stop offset="85%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <!-- Visor Reflection -->
    <linearGradient id="visorReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Suit White Fabric -->
    <linearGradient id="suitFabric" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="1920" height="1080" fill="url(#deepCosmos)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.5" opacity="0.8"/>
    <circle cx="280" cy="180" r="1.2" opacity="0.5"/>
    <circle cx="480" cy="80" r="2" opacity="0.9"/>
    <circle cx="680" cy="220" r="1" opacity="0.4"/>
    <circle cx="890" cy="110" r="1.8" opacity="0.75"/>
    <circle cx="1100" cy="60" r="1.5" opacity="0.6"/>
    <circle cx="1320" cy="150" r="2" opacity="0.8"/>
    <circle cx="1550" cy="90" r="1.2" opacity="0.5"/>
    <circle cx="1780" cy="130" r="2.2" opacity="0.9"/>
    <circle cx="1880" cy="280" r="1" opacity="0.5"/>
    <circle cx="340" cy="380" r="1.4" opacity="0.6"/>
    <circle cx="1480" cy="360" r="1.6" opacity="0.7"/>
  </g>

  <!-- Earth / Mars Limb in Orbit -->
  <path d="M600,1080 C900,750 1450,600 1920,640 L1920,1080 Z" fill="#040c1a"/>
  <!-- Atmospheric Horizon Glow -->
  <path d="M600,1080 C900,750 1450,600 1920,640" stroke="#38bdf8" stroke-width="6" fill="none" opacity="0.9"/>
  <path d="M600,1080 C900,750 1450,600 1920,640" stroke="#93c5fd" stroke-width="18" fill="none" opacity="0.35" filter="url(#softGlow)"/>

  <!-- Orbital Sunrise Flare -->
  <circle cx="1400" cy="620" rx="350" ry="250" fill="url(#sunDawn)"/>

  <!-- Cupola Window Architecture Structural Frames -->
  <g stroke="#0f172a" stroke-width="16" fill="none" opacity="0.85">
    <path d="M0,0 L500,540 L0,1080"/>
    <circle cx="500" cy="540" r="540"/>
  </g>

  <!-- Astronaut in SpaceX EVA/IVA Suit in Foreground Silhouette / Profile -->
  <g transform="translate(480, 680)">
    <!-- Shoulders and Torso -->
    <path d="M-120,400 C-140,260 -100,160 -40,110 L40,110 C100,160 140,260 120,400 Z" fill="url(#suitFabric)"/>

    <!-- Dark Contrast Accents on SpaceX Suit -->
    <path d="M-80,400 C-90,280 -60,190 -20,160 L-35,400 Z" fill="#0f172a"/>
    <path d="M80,400 C90,280 60,190 20,160 L35,400 Z" fill="#0f172a"/>

    <!-- Neck Ring -->
    <ellipse cx="0" cy="110" rx="46" ry="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>

    <!-- Helmet Outer Shell -->
    <path d="M-52,105 C-65,30 -55,-45 0,-65 C55,-45 65,30 52,105 Z" fill="url(#suitFabric)"/>

    <!-- Dark Aerodynamic Visor with Reflection of Earth & Sunrise -->
    <path d="M-38,80 C-48,20 -40,-35 0,-50 C40,-35 48,20 38,80 Z" fill="url(#visorReflect)" stroke="#090d16" stroke-width="3"/>

    <!-- Subtle Visor Glass Glint -->
    <path d="M-28,-25 C-10,-40 10,-40 28,-25" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.7"/>
    <ellipse cx="14" cy="10" rx="8" ry="18" fill="#ffffff" opacity="0.15" transform="rotate(25 14 10)"/>
  </g>
</svg>