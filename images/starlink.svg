<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Space -->
    <linearGradient id="starlinkSpace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020307"/>
      <stop offset="50%" stop-color="#060914"/>
      <stop offset="100%" stop-color="#0c1224"/>
    </linearGradient>

    <!-- Solar Panel Array Gradient -->
    <linearGradient id="solarPanel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08142b"/>
      <stop offset="25%" stop-color="#122c54"/>
      <stop offset="70%" stop-color="#1d427b"/>
      <stop offset="100%" stop-color="#0d1e3a"/>
    </linearGradient>

    <!-- Earth Atmosphere -->
    <radialGradient id="slEarthLimb" cx="50%" cy="130%" r="85%">
      <stop offset="0%" stop-color="#071b38"/>
      <stop offset="48%" stop-color="#005288"/>
      <stop offset="60%" stop-color="#00a8e8"/>
      <stop offset="65%" stop-color="#64d8cb"/>
      <stop offset="70%" stop-color="rgba(100, 216, 203, 0.35)"/>
      <stop offset="76%" stop-color="rgba(0, 82, 136, 0.08)"/>
      <stop offset="90%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <!-- Satellite Metallic Chassis -->
    <linearGradient id="satChassis" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- City Lights Glow -->
    <radialGradient id="cityGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)"/>
    </radialGradient>
  </defs>

  <!-- Deep Cosmos -->
  <rect width="1920" height="1080" fill="url(#starlinkSpace)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="100" cy="140" r="1.5" opacity="0.8"/>
    <circle cx="260" cy="70" r="1" opacity="0.5"/>
    <circle cx="430" cy="180" r="1.8" opacity="0.75"/>
    <circle cx="670" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="890" cy="160" r="2.2" opacity="0.9"/>
    <circle cx="1120" cy="80" r="1.5" opacity="0.7"/>
    <circle cx="1340" cy="190" r="1.2" opacity="0.5"/>
    <circle cx="1580" cy="110" r="2" opacity="0.8"/>
    <circle cx="1790" cy="160" r="1.5" opacity="0.6"/>
    <circle cx="320" cy="310" r="1.2" opacity="0.5"/>
    <circle cx="1690" cy="290" r="1.5" opacity="0.6"/>
  </g>

  <!-- Constellation Intersatellite Laser Links (Fine Glowing Cyan Lines) -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,8" opacity="0.55">
    <line x1="180" y1="280" x2="820" y2="420"/>
    <line x1="820" y1="420" x2="1480" y2="340"/>
    <line x1="1480" y1="340" x2="1820" y2="240"/>
    <line x1="500" y1="200" x2="820" y2="420"/>
  </g>

  <!-- Earth Curvature Below -->
  <ellipse cx="960" cy="1380" rx="1500" ry="720" fill="#020914"/>
  <ellipse cx="960" cy="1380" rx="1500" ry="720" fill="url(#slEarthLimb)"/>

  <!-- Nocturnal City Lights (Golden clusters glowing on night Earth) -->
  <g fill="#fbbf24" opacity="0.65">
    <circle cx="450" cy="910" r="2.5"/>
    <circle cx="465" cy="905" r="1.8"/>
    <circle cx="480" cy="918" r="2.2"/>
    <circle cx="510" cy="895" r="3"/>
    <circle cx="540" cy="915" r="2"/>
    <circle cx="700" cy="940" r="2.5"/>
    <circle cx="720" cy="935" r="2"/>
    <circle cx="750" cy="950" r="3.5"/>
    <circle cx="780" cy="938" r="2"/>
    <circle cx="1100" cy="920" r="2.8"/>
    <circle cx="1130" cy="915" r="3"/>
    <circle cx="1160" cy="930" r="2.2"/>
    <circle cx="1350" cy="910" r="2.5"/>
    <circle cx="1380" cy="900" r="3.2"/>
    <circle cx="1420" cy="925" r="2"/>
  </g>

  <!-- Starlink Spacecraft in Orbit (Foreground Left to Center) -->
  <g transform="translate(850, 430) rotate(-22)">
    <!-- Phased Array Antennas / Main Body Flat Panel -->
    <rect x="-140" y="-12" width="280" height="24" rx="4" fill="url(#satChassis)"/>
    <!-- Antennas Array Texture -->
    <circle cx="-90" cy="0" r="6" fill="#1e293b"/>
    <circle cx="-40" cy="0" r="6" fill="#1e293b"/>
    <circle cx="10" cy="0" r="6" fill="#1e293b"/>
    <circle cx="60" cy="0" r="6" fill="#1e293b"/>
    <circle cx="110" cy="0" r="6" fill="#1e293b"/>

    <!-- Krypton / Argon Ion Hall-Effect Thruster -->
    <rect x="-145" y="-6" width="6" height="12" fill="#0284c7"/>
    <!-- Subtle Thruster Ion Glow -->
    <ellipse cx="-152" cy="0" rx="8" ry="4" fill="#38bdf8" opacity="0.8"/>

    <!-- Single Large Deployed Solar Array (Starlink v1.5 / v2 Mini style) -->
    <!-- Hinged Boom Arm -->
    <line x1="0" y1="-12" x2="0" y2="-60" stroke="#64748b" stroke-width="4"/>
    
    <!-- Giant Solar Array Wing -->
    <rect x="-65" y="-360" width="130" height="300" fill="url(#solarPanel)" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Solar Cell Grid Lines -->
    <line x1="-65" y1="-310" x2="65" y2="-310" stroke="#0ea5e9" stroke-width="1" opacity="0.6"/>
    <line x1="-65" y1="-260" x2="65" y2="-260" stroke="#0ea5e9" stroke-width="1" opacity="0.6"/>
    <line x1="-65" y1="-210" x2="65" y2="-210" stroke="#0ea5e9" stroke-width="1" opacity="0.6"/>
    <line x1="-65" y1="-160" x2="65" y2="-160" stroke="#0ea5e9" stroke-width="1" opacity="0.6"/>
    <line x1="-65" y1="-110" x2="65" y2="-110" stroke="#0ea5e9" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-360" x2="0" y2="-60" stroke="#0284c7" stroke-width="1.5" opacity="0.8"/>

    <!-- Solar Array Sunlight Reflection Sheen -->
    <polygon points="-65,-360 20,-360 -20,-60 -65,-60" fill="rgba(255, 255, 255, 0.08)"/>
  </g>
</svg>